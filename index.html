<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap" rel="stylesheet">
    <title>Browser</title>
    <script src="main.js" defer></script>
</head>
<body>
    <nav>
        <!-- CHANGE BACK TO logo.png -->
        <a href="/" class="logo"><div><img src="media/3.png" alt="bannner"><div style="width: 1.2rem;"></div>x3<span class="logo-sans">.rocks</span></div></a>
    </nav>
    <div style="height: 4rem; background-color: #1f222f;"></div>
    <main>
        <div class="sidebar"></div>
        <div id="main-images">
            <div class="img-grid" id="img-grid">
                <button class="grid-img">
                    <img src="media/3.png" alt="test">
                </button>
            </div>
        </div>
        <div class="viewer-buffer"></div>
        <div class="viewer-panel">
            <div class="preview-img">
                <img src="media/3.png" alt="test">
                <a href="media/3.png" class="img-btn" download>Save</a>
            </div>
        </div>
    </main>
